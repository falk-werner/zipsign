name: Ubuntu Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 17 * * 5'

jobs:

  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openssl libssl-dev bats

      - name: Unit Test
        run: |
          cargo test

      - name: Lint
        run: |
          cargo clippy --all-targets -- -D warnings

      - name: Build
        run: |
          cargo build --release

      - name: Integration Test
        run: |
          bats ./test/


