name: Mac OS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 17 * * 5'

jobs:

  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install bats-core openssl@3

      - name: Unit Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Integration Test
        run: bats ./test/

