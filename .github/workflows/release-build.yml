name: Release Build

on:
  push:
    tags: [ "v*" ]

jobs:

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "$tag" \
              --repo="$GITHUB_REPOSITORY" \
              --title="${GITHUB_REPOSITORY#*/} ${tag#v}" \
              --generate-notes  \
              --latest \
              --verify-tag 

  windows-release:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write

    defaults:
      run:
        shell: msys2 {0}
    
    steps:
      - name: Setup msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            bash
            zip
            git
            mingw-w64-x86_64-github-cli
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-osslsigncode
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-rust

      - name: Setup bats
        run: |
          git clone --depth 1 --branch v1.11.1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          /tmp/bats-core/install.sh /usr
          rm -rf /tmp/bats-core

      - name: Checkout
        uses: actions/checkout@v7

      - name: Unit Test
        run: |
          cargo test

      - name: Build
        run: |
          cargo build --release

      - name: Integration Test
        run: |
          bats ./test/

      - name: Print Dependencies
        run: |
          ldd target/release/zipsign.exe

      - name: Sign
        env:
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
          SIGN_PASS: ${{ secrets.SIGN_PASSWORD }}
        run: |
          echo "$SIGN_KEY" > /tmp/sign_key.pem
          osslsigncode sign -certs certs/sign_cert.pem \
            -key /tmp/sign_key.pem -pass "$SIGN_PASS" \
            -n "ZipSign" -i https://github.com/falk-werner/zipsign \
            -t http://timestamp.digicert.com \
            -in target/release/zipsign.exe -out target/release/zipsign_signed.exe
          rm /tmp/sign_key.pem

      - name: Prepare Dist
        run: |
          mkdir dist
          cp target/release/zipsign_signed.exe dist/zipsign.exe
          cp /mingw64/bin/libgcc_s_seh-1.dll dist
          cp /mingw64/bin/libwinpthread-1.dll dist
          cp /mingw64/bin/libcrypto-3-x64.dll dist          
          cp LICENSE dist
          if [ -d 3rd-party-licenses ]; then cp 3rd-party-licenses/* dist; fi
          cd dist && zip zipsign-win32.zip -r *

      - name: Upload Artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release upload "${tag}" dist/zipsign-win32.zip


  ubuntu-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openssl libssl-dev bats

      - name: Unit Test
        run: |
          cargo test

      - name: Build
        run: |
          cargo build --release

      - name: Integration Test
        run: |
          bats ./test/

      - name: Install cargo-deb
        run: |
          cargo install cargo-deb

      - name: Package (.deb)
        run: |
          cargo deb --no-build

      - name: Upload Artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          mv target/debian/zipsign_*.deb zipsign-${tag#v}-amd64.deb
          sha256sum zipsign-${tag#v}-amd64.deb > zipsign-${tag#v}-amd64.deb.sha256
          gh release upload "${tag}" \
            zipsign-${tag#v}-amd64.deb \
            zipsign-${tag#v}-amd64.deb.sha256

